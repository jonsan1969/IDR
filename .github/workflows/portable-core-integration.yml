name: Portable core integration

on:
  push:
    branches:
      - agent/portable-core-integration
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: portable-core-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc-x86-core-link:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare portable real translation units
        shell: pwsh
        run: |
          .\tests\prepare_portable_disasm.ps1
          .\tests\prepare_portable_decompiler_full.ps1
          .\tests\prepare_portable_misc_full.ps1
          .\tests\prepare_portable_knowledgebase_full.ps1
          .\tests\prepare_portable_infos_full.ps1

      - name: Compile integrated core objects
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrCoreServices.cpp /Fo:IdrCoreServices.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrImageContext.cpp /Fo:IdrImageContext.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrPeLoader.cpp /Fo:IdrPeLoader.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrAnalysis.cpp /Fo:IdrAnalysis.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrAnalysisState.cpp /Fo:IdrAnalysisState.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrInstructionNav.cpp /Fo:IdrInstructionNav.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrDecompilerModel.cpp /Fo:IdrDecompilerModel.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\IdrLegacyBridge.cpp /Fo:IdrLegacyBridge.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\idr_core_link_probe.cpp /Fo:idr_core_link_probe.obj || exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /I. /Iportable\core /c portable\core\idr_pe_loader_probe.cpp /Fo:idr_pe_loader_probe.obj || exit /b 1
          cl /nologo /std:c++17 /W3 /EHsc /I. /c tests\generated\Disasm.portable.cpp /Fo:Disasm.portable.obj || exit /b 1

      - name: Compile full legacy KnowledgeBase translation unit
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W3 /EHsc /I. /Iportable\core /Itests\generated /c tests\generated\KnowledgeBase.portable.cpp /Fo:KnowledgeBase.portable.obj || exit /b 1

      - name: Compile full legacy Infos translation unit
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W3 /EHsc /I. /Iportable\core /Itests\generated /c tests\generated\Infos.portable.cpp /Fo:Infos.portable.obj || exit /b 1

      - name: Compile full legacy Misc translation unit
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W3 /EHsc /I. /Iportable\core /Itests\generated /c tests\generated\Misc.portable.cpp /Fo:Misc.portable.obj || exit /b 1

      - name: Compile full legacy Decompiler translation unit
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W3 /EHsc /I. /Iportable\core /Itests\generated /c tests\generated\Decompiler.portable.cpp /Fo:Decompiler.portable.obj || exit /b 1

      - name: Link integrated core probe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          link /nologo /subsystem:console /out:idr-core-link-probe.exe IdrCoreServices.obj IdrImageContext.obj IdrPeLoader.obj IdrAnalysis.obj IdrAnalysisState.obj IdrInstructionNav.obj IdrDecompilerModel.obj IdrLegacyBridge.obj idr_core_link_probe.obj Disasm.portable.obj KnowledgeBase.portable.obj Infos.portable.obj Misc.portable.obj Decompiler.portable.obj > link-output.txt 2>&1
          if errorlevel 1 (
            for /f "usebackq delims=" %%L in ("link-output.txt") do echo ::error title=MSVC linker::%%L
            type link-output.txt
            exit /b 1
          )
          type link-output.txt

      - name: Run linked probe
        shell: cmd
        run: .\idr-core-link-probe.exe

      - name: Link PE32 session probe
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          link /nologo /subsystem:console /out:idr-pe-loader-probe.exe IdrCoreServices.obj IdrImageContext.obj IdrPeLoader.obj IdrAnalysis.obj IdrAnalysisState.obj IdrInstructionNav.obj IdrDecompilerModel.obj IdrLegacyBridge.obj idr_pe_loader_probe.obj Disasm.portable.obj KnowledgeBase.portable.obj Infos.portable.obj Misc.portable.obj Decompiler.portable.obj || exit /b 1

      - name: Run PE32 session probe
        shell: cmd
        run: .\idr-pe-loader-probe.exe
