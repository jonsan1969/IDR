name: Portable core smoke

on:
  push:
    branches:
      - agent/portable-core-smoke
  workflow_dispatch:

jobs:
  msvc-portable-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile Disasm header smoke test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /c tests\portable_disasm_header_smoke.cpp /Fo:portable_disasm_header_smoke.obj

      - name: Compile KnowledgeBase header smoke test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /c tests\portable_kb_header_smoke.cpp /Fo:portable_kb_header_smoke.obj

      - name: Prepare portable Disasm.cpp copy
        shell: pwsh
        run: .\tests\prepare_portable_disasm.ps1

      - name: Compile Disasm.cpp portable smoke test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W3 /EHsc /c tests\generated\Disasm.portable.cpp /Fo:Disasm.portable.obj
