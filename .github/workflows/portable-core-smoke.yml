name: Portable core smoke

on:
  push:
    branches:
      - agent/portable-core-smoke
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: portable-core-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc-portable-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile Disasm header smoke test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /c tests\portable_disasm_header_smoke.cpp /Fo:portable_disasm_header_smoke.obj

      - name: Compile KnowledgeBase header smoke test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /c tests\portable_kb_header_smoke.cpp /Fo:portable_kb_header_smoke.obj

      - name: Compile Infos header smoke test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /c tests\portable_infos_header_smoke.cpp /Fo:portable_infos_header_smoke.obj

      - name: Prepare portable Decompiler header copy
        shell: pwsh
        run: .\tests\prepare_portable_decompiler.ps1

      - name: Compile Decompiler header smoke test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /I. /c tests\portable_decompiler_header_smoke.cpp /Fo:portable_decompiler_header_smoke.obj

      - name: Prepare Decompiler implementation slice
        shell: pwsh
        run: .\tests\prepare_portable_decompiler_slice.ps1

      - name: Compile Decompiler implementation slice
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /Itests /I. /c tests\generated\Decompiler.slice.cpp /Fo:Decompiler.slice.obj

      - name: Prepare Decompiler branch-analysis slice
        shell: pwsh
        run: .\tests\prepare_portable_decompiler_branch_slice.ps1

      - name: Compile Decompiler branch-analysis slice
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /Itests /I. /c tests\generated\Decompiler.branch.slice.cpp /Fo:Decompiler.branch.slice.obj

      - name: Prepare Decompiler engine slice
        shell: pwsh
        run: .\tests\prepare_portable_decompiler_engine_slice.ps1

      - name: Compile Decompiler engine slice
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /Itests /I. /c tests\generated\Decompiler.engine.slice.cpp /Fo:Decompiler.engine.slice.obj

      - name: Prepare Decompiler case-enum slice
        shell: pwsh
        run: .\tests\prepare_portable_decompiler_case_slice.ps1

      - name: Compile Decompiler case-enum slice
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /Itests /I. /c tests\generated\Decompiler.case.slice.cpp /Fo:Decompiler.case.slice.obj

      - name: Prepare Decompiler syscall slice
        shell: pwsh
        run: .\tests\prepare_portable_decompiler_syscall_slice.ps1

      - name: Compile Decompiler syscall slice
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W4 /EHsc /Itests /I. /c tests\generated\Decompiler.syscall.slice.cpp /Fo:Decompiler.syscall.slice.obj

      - name: Prepare portable Disasm.cpp copy
        shell: pwsh
        run: .\tests\prepare_portable_disasm.ps1

      - name: Compile Disasm.cpp portable smoke test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cl /nologo /std:c++17 /W3 /EHsc /I. /c tests\generated\Disasm.portable.cpp /Fo:Disasm.portable.obj
